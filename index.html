<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passaparola AR - Yapay Zeka Sesli Yarışma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050814;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Mirror video feed for realistic mirror view */
        #webcam {
            transform: scaleX(-1);
            object-fit: cover;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(0, 240, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .glass-button:active {
            transform: translateY(1px);
        }

        /* Neon Glow Effects */
        .glow-cyan {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .glow-gold {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .glow-green {
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.8), 0 0 20px rgba(0, 255, 100, 0.4);
        }

        /* Pulse animation for microphone visualizer */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .listening-pulse {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between p-4 md:p-6">

    <!-- AR Camera & Canvas Layer -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden bg-black">
        <video id="webcam" class="absolute inset-0 w-full h-full" autoplay playsinline muted></video>
        <canvas id="arCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
    </div>

    <!-- HUD Header Bar -->
    <header class="relative z-10 w-full flex justify-between items-center glass-panel rounded-2xl p-4 md:px-8 border-cyan-500/30">
        <!-- Title & Status -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center text-cyan-400 font-orbitron font-bold text-xl glow-cyan">
                <i class="fa-solid font-bold fa-circle-notch animate-spin text-sm" id="spinnerIcon" style="display:none;"></i>
                <i class="fa-solid fa-gamepad" id="gameIcon"></i>
            </div>
            <div>
                <h1 class="font-orbitron text-xl md:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    PASSAPAROLA <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 border border-cyan-400/40 text-cyan-300">AR VOICE</span>
                </h1>
                <p class="text-xs text-gray-400 font-sans hidden sm:block">Televizyon Efsanesi Şimdi Kameranda!</p>
            </div>
        </div>

        <!-- Score Board & Timer -->
        <div class="flex items-center space-x-4 md:space-x-8">
            <!-- Correct Count -->
            <div class="text-center">
                <p class="text-xs text-gray-400 tracking-wider">DOĞRU</p>
                <p id="scoreCorrect" class="font-orbitron text-xl md:text-2xl font-bold text-emerald-400 glow-green">0</p>
            </div>
            <!-- Wrong Count -->
            <div class="text-center">
                <p class="text-xs text-gray-400 tracking-wider">YANLIŞ</p>
                <p id="scoreWrong" class="font-orbitron text-xl md:text-2xl font-bold text-rose-500">0</p>
            </div>
            <!-- Countdown Timer -->
            <div class="text-center pl-4 border-l border-white/10">
                <p class="text-xs text-cyan-300 tracking-wider">SÜRE</p>
                <div class="flex items-center space-x-1">
                    <i class="fa-solid fa-stopwatch text-amber-400 text-sm animate-pulse"></i>
                    <span id="timerDisplay" class="font-orbitron text-2xl md:text-3xl font-black text-amber-400 glow-gold">100</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Question Box & Active Speech Display -->
    <main class="relative z-10 w-full max-w-3xl mx-auto my-auto flex flex-col items-center">
        <!-- Question Display Card -->
        <div id="questionCard" class="w-full glass-panel rounded-3xl p-6 md:p-8 text-center transition-all duration-300 border-amber-400/40 shadow-2xl relative overflow-hidden">
            <!-- Current Letter Badge -->
            <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 px-6 py-1 bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-orbitron font-black text-lg md:text-xl rounded-full shadow-lg border-2 border-amber-200" id="currentLetterBadge">
                HARF: A
            </div>

            <!-- Question Text -->
            <p id="questionText" class="text-xl md:text-2xl lg:text-3xl font-semibold leading-relaxed text-slate-100 mt-4 min-h-[80px] flex items-center justify-center">
                Oyunu başlatmak için aşağıdaki "BAŞLAT" butonuna bas veya "Başla" de!
            </p>

            <!-- Detected Speech Feedback Box -->
            <div id="speechBox" class="mt-4 pt-3 border-t border-white/10 flex items-center justify-center space-x-2 text-sm md:text-base text-cyan-300 font-mono">
                <div id="micIndicator" class="w-3 h-3 rounded-full bg-slate-500"></div>
                <span id="speechStatus" class="text-gray-400 italic">Ses dinleme hazır...</span>
                <span id="speechTranscript" class="font-bold text-cyan-200 underline underline-offset-4"></span>
            </div>
        </div>
    </main>

    <!-- HUD Footer Controls & Instructions -->
    <footer class="relative z-10 w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 glass-panel rounded-2xl p-4 border-cyan-500/20">
        <!-- Voice Command Hints -->
        <div class="flex items-center space-x-3 text-xs md:text-sm text-gray-300">
            <div class="p-2 rounded-lg bg-cyan-500/10 border border-cyan-400/30 text-cyan-400">
                <i class="fa-solid fa-microphone"></i>
            </div>
            <div>
                <span class="font-bold text-white">Ses Komutları:</span>
                <span class="text-amber-300 ml-1">"PAS"</span> pas geçer |
                <span class="text-emerald-300 ml-1">Cevabını söyle</span>
            </div>
        </div>

        <!-- Game Control Buttons -->
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
            <button id="btnStart" onclick="startGame()" class="glass-button px-6 py-3 rounded-xl font-orbitron font-bold text-emerald-400 flex items-center space-x-2 text-sm md:text-base">
                <i class="fa-solid fa-play"></i>
                <span>BAŞLAT</span>
            </button>
            <button id="btnPass" onclick="handlePass()" class="glass-button px-5 py-3 rounded-xl font-orbitron font-bold text-amber-400 flex items-center space-x-2 text-sm md:text-base" disabled>
                <i class="fa-solid fa-forward"></i>
                <span>PAS</span>
            </button>
            <button id="btnRestart" onclick="resetGame()" class="glass-button px-5 py-3 rounded-xl font-orbitron font-bold text-rose-400 flex items-center space-x-2 text-sm md:text-base">
                <i class="fa-solid fa-rotate-right"></i>
                <span>YENİDEN</span>
            </button>
        </div>
    </footer>

    <!-- Audio FX & Game Logic JavaScript -->
    <script>
        /**
         * PASSAPAROLA AR - GAME ENGINE & SYSTEM CONTROLLER
         */

        // 1. TURKISH ALPHABET & QUESTION BANK (Passaparola Style)
        const ALPHABET = ["A", "B", "C", "Ç", "D", "E", "F", "G", "H", "İ", "K", "L", "M", "N", "O", "P", "R", "S", "Ş", "T", "U", "Ü", "V", "Y", "Z"];

        const QUESTIONS_BANK = {
            "A": { q: "Gökyüzünde geceleri parıldayan, etrafında gezegenler dönen devasa gaz kütlesi?", answer: "AY", alt: ["YILDIZ", "ASTRONOMİ"] },
            "B": { q: "Bilgisayarda tüm donanım birimlerinin takıldığı ana devre kartı?", answer: "ANAKART", alt: ["BİLGİSAYAR"] },
            "C": { q: "Maddenin en küçük yapı taşı olarak bilinen nötron ve elektronlu yapı?", answer: "ATOM", alt: ["CEVAP"] },
            "Ç": { q: "Çocukların parkta üzerine oturup sallandığı veya kaydığı oyun alanı gereci?", answer: "ÇIKRIK", alt: ["ÇOCUK", "ÇATAL"] },
            "D": { q: "Dünya etrafında dönen ve geceleri gökyüzünü aydınlatan doğal uydumuz?", answer: "DÜNYA", alt: ["DENİZ", "DOĞA"] },
            "E": { q: "Maddenin ısı alarak sıvı halden gaz haline geçmesi olayı?", answer: "BUHARLAŞMA", alt: ["EVREN"] },
            "F": { q: "Işık enerjisini yakalayıp elektrik enerjisine çeviren araca verilen genel ad?", answer: "FOTOVOLTAİK", alt: ["FOTOĞRAF"] },
            "G": { q: "Gündüzleri dünyamızı aydınlatan ve ısıtan sistemimizin merkezindeki yıldız?", answer: "GÜNEŞ", alt: ["GEZEGEN"] },
            "H": { q: "Canlıların yaşaması için soluduğu, oksijen içeren gaz karışımı?", answer: "HAVA", alt: ["HAYAT"] },
            "İ": { q: "İnternet sitelerinin birbirine bağlanmasını sağlayan ağ sistemi?", answer: "İNTERNET", alt: ["İLETİŞİM"] },
            "K": { q: "Kedigiller familyasından, çölün ve ormanın kralı olarak anılan yırtıcı hayvan?", answer: "ASLAN", alt: ["KAPLAN", "KEDİ"] },
            "L": { q: "Karanlıkta yön bulmayı sağlayan yoğun ve düzgün ışık demeti üreten cihaz?", answer: "LAZER", alt: ["LAMBA"] },
            "M": { q: "Mıknatısın çektiği, sanayide ve yapılarda çok kullanılan sağlam maden?", answer: "DEMİR", alt: ["MADEN", "METAL"] },
            "N": { q: "Geceleri gökyüzünü inceleyen, uzay çalışmalarını yürüten bilim insanı?", answer: "ASTRONOT", alt: ["NEBULA"] },
            "O": { q: "Soluduğumuz havada bulunan ve yaşam için şart olan renksiz gaz?", answer: "OKSİJEN", alt: ["OKYANUS"] },
            "P": { q: "Güneş sistemimizde sekizinci ve mavi renkli gaz devi olan gezegen?", answer: "NEPTÜN", alt: ["PLANET", "PUSULA"] },
            "R": { q: "Ses ve müzik yayınlarını uzak mesafelere ileten elektronik cihaz?", answer: "RADYO", alt: ["ROKET"] },
            "S": { q: "Su molekülünü oluşturan elementlerden hidrojen dışındaki diğeri?", answer: "OKSİJEN", alt: ["SU", "SES"] },
            "Ş": { q: "Elektrik akımını ölçmekte veya kontrol etmekte kullanılan düzenek?", answer: "ŞALTER", alt: ["ŞİMŞEK"] },
            "T": { q: "Dünyamızın atmosferini oluşturan katmanlardan en alt tabakası?", answer: "TROPOSFER", alt: ["TEKNOLOJİ"] },
            "U": { q: "Dünya atmosferinin dışında kalan sonsuz boşluk?", answer: "UZAY", alt: ["UYDU"] },
            "Ü": { q: "Elektrik enerjisini kullanarak ısı üreten ev aleti?", answer: "ÜTÜ", alt: ["ÜRETİCİ"] },
            "V": { q: "Vücudumuza kan pompalayan ve göğsümüzde bulunan organımız?", answer: "KALP", alt: ["VÜCUT"] },
            "Y": { q: "Gezegenimizin etrafında dönen ve gece ışık saçan gök cismi?", answer: "AY", alt: ["YILDIZ"] },
            "Z": { q: "Zamanı saat, dakika ve saniye olarak gösteren araç?", answer: "SAAT", alt: ["ZAMAN"] }
        };

        // Substitute default questions for accurate Passaparola matching
        ALPHABET.forEach(letter => {
            if (!QUESTIONS_BANK[letter]) {
                QUESTIONS_BANK[letter] = { q: `${letter} harfi ile başlayan kelimeyi tahmin edin.`, answer: letter + "ABO", alt: [] };
            }
        });

        // 2. STATE MANAGEMENT
        let gameState = {
            isRunning: false,
            currentIndex: 0,
            timer: 100,
            timerInterval: null,
            scoreCorrect: 0,
            scoreWrong: 0,
            lettersState: {}, // 'pending', 'active', 'correct', 'wrong', 'passed'
            isListening: false,
            isSpeaking: false
        };

        // Initialize letter states
        ALPHABET.forEach(l => gameState.lettersState[l] = 'pending');

        // 3. SOUND SYNTHESIS (Web Audio API)
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const osc = AudioCtx.createOscillator();
                const gain = AudioCtx.createGain();
                osc.connect(gain);
                gain.connect(AudioCtx.destination);

                const now = AudioCtx.currentTime;

                if (type === 'tick') {
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'pass') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.warn('Audio play error', e);
            }
        }

        // 4. WEBCAM & AR CANVAS RENDERER
        const videoEl = document.getElementById('webcam');
        const canvasEl = document.getElementById('arCanvas');
        const ctx = canvasEl.getContext('2d');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                    audio: false
                });
                videoEl.srcObject = stream;
            } catch (err) {
                console.warn('Camera access denied or unavailable:', err);
            }
        }

        function resizeCanvas() {
            canvasEl.width = window.innerWidth;
            canvasEl.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Render Loop for AR HUD Overlay
        function renderAR() {
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            const centerX = canvasEl.width / 2;
            const centerY = canvasEl.height / 2;
            // Radius responsive based on screen height/width
            const radius = Math.min(canvasEl.width, canvasEl.height) * 0.32;
            const totalLetters = ALPHABET.length;

            // Draw central glowing halo
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 15, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();

            // Draw Alphabet Wheel Badges
            ALPHABET.forEach((letter, idx) => {
                // Calculate angle starting from top (-90 deg)
                const angle = (idx / totalLetters) * (Math.PI * 2) - (Math.PI / 2);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                const state = gameState.lettersState[letter];
                let bgColor = 'rgba(10, 20, 40, 0.85)';
                let borderColor = '#00f0ff';
                let textColor = '#ffffff';
                let glowColor = 'rgba(0, 240, 255, 0.5)';
                let badgeRadius = 22;

                if (idx === gameState.currentIndex && gameState.isRunning) {
                    // Active current letter
                    bgColor = 'rgba(255, 215, 0, 0.9)';
                    borderColor = '#ffffff';
                    textColor = '#000000';
                    glowColor = 'rgba(255, 215, 0, 0.9)';
                    badgeRadius = 28;
                } else if (state === 'correct') {
                    bgColor = 'rgba(0, 230, 118, 0.9)';
                    borderColor = '#00ff66';
                    textColor = '#000000';
                    glowColor = 'rgba(0, 255, 102, 0.8)';
                } else if (state === 'wrong') {
                    bgColor = 'rgba(255, 23, 68, 0.85)';
                    borderColor = '#ff1744';
                    textColor = '#ffffff';
                    glowColor = 'rgba(255, 23, 68, 0.8)';
                } else if (state === 'passed') {
                    bgColor = 'rgba(255, 152, 0, 0.85)';
                    borderColor = '#ff9800';
                    textColor = '#ffffff';
                    glowColor = 'rgba(255, 152, 0, 0.8)';
                }

                // Badge Shadow & Glow
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, badgeRadius, 0, Math.PI * 2);
                ctx.fillStyle = bgColor;
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 12;
                ctx.fill();

                // Border
                ctx.lineWidth = (idx === gameState.currentIndex && gameState.isRunning) ? 4 : 2;
                ctx.strokeStyle = borderColor;
                ctx.stroke();

                // Letter Text
                ctx.shadowBlur = 0;
                ctx.fillStyle = textColor;
                ctx.font = `bold ${badgeRadius * 0.9}px 'Orbitron', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(letter, x, y + 2);
                ctx.restore();
            });

            requestAnimationFrame(renderAR);
        }

        // 5. WEB SPEECH API INTEGRATION (STT & TTS)
        let recognition = null;
        const synth = window.speechSynthesis;

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'tr-TR';

                recognition.onstart = () => {
                    gameState.isListening = true;
                    updateMicStatus(true, 'Sizi dinliyorum...');
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    transcript = transcript.trim().toUpperCase();
                    document.getElementById('speechTranscript').innerText = `"${transcript}"`;

                    if (event.results[event.results.length - 1].isFinal) {
                        evaluateSpeechInput(transcript);
                    }
                };

                recognition.onerror = (e) => {
                    console.warn('STT Error:', e.error);
                    updateMicStatus(false, 'Mikrofon hatası');
                };

                recognition.onend = () => {
                    gameState.isListening = false;
                    // Auto-restart listening if game is active
                    if (gameState.isRunning && !gameState.isSpeaking) {
                        try { recognition.start(); } catch (err) {}
                    } else {
                        updateMicStatus(false, 'Dinleme durduruldu');
                    }
                };
            } else {
                updateMicStatus(false, 'Web Speech API desteklenmiyor');
            }
        }

        function updateMicStatus(active, text) {
            const micDot = document.getElementById('micIndicator');
            const statusText = document.getElementById('speechStatus');
            if (active) {
                micDot.className = "w-3 h-3 rounded-full bg-emerald-400 listening-pulse";
                statusText.className = "text-emerald-400 font-bold";
            } else {
                micDot.className = "w-3 h-3 rounded-full bg-rose-500";
                statusText.className = "text-gray-400 italic";
            }
            statusText.innerText = text;
        }

        // Text To Speech Readout
        function speakPrompt(text, callback) {
            if (!synth) {
                if (callback) callback();
                return;
            }

            synth.cancel(); // Stop any ongoing speech
            gameState.isSpeaking = true;

            // Pause STT during TTS to prevent hearing itself
            if (recognition && gameState.isListening) {
                try { recognition.stop(); } catch (e) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.05;
            utterance.pitch = 1.0;

            utterance.onend = () => {
                gameState.isSpeaking = false;
                if (gameState.isRunning && recognition) {
                    try { recognition.start(); } catch (e) {}
                }
                if (callback) callback();
            };

            utterance.onerror = () => {
                gameState.isSpeaking = false;
                if (gameState.isRunning && recognition) {
                    try { recognition.start(); } catch (e) {}
                }
                if (callback) callback();
            };

            synth.speak(utterance);
        }

        // 6. GAME LOGIC & EVALUATION ENGINE
        function startGame() {
            if (gameState.isRunning) return;

            gameState.isRunning = true;
            gameState.timer = 100;
            gameState.scoreCorrect = 0;
            gameState.scoreWrong = 0;
            gameState.currentIndex = 0;
            ALPHABET.forEach(l => gameState.lettersState[l] = 'pending');

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnPass').disabled = false;
            updateScoreboard();

            // Start Countdown Timer
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.timer > 0) {
                    gameState.timer--;
                    document.getElementById('timerDisplay').innerText = gameState.timer;
                    playSound('tick');
                } else {
                    endGame('Süre doldu!');
                }
            }, 1000);

            // Initial speech start
            if (recognition) {
                try { recognition.start(); } catch (e) {}
            }

            loadNextQuestion();
        }

        function loadNextQuestion() {
            // Find next pending or passed question index
            let initialIdx = gameState.currentIndex;
            let found = false;

            for (let i = 0; i < ALPHABET.length; i++) {
                let idx = (initialIdx + i) % ALPHABET.length;
                let letter = ALPHABET[idx];
                if (gameState.lettersState[letter] === 'pending' || gameState.lettersState[letter] === 'passed') {
                    gameState.currentIndex = idx;
                    found = true;
                    break;
                }
            }

            if (!found) {
                endGame('Tüm sorular tamamlandı!');
                return;
            }

            const currentLetter = ALPHABET[gameState.currentIndex];
            const qData = QUESTIONS_BANK[currentLetter];

            document.getElementById('currentLetterBadge').innerText = `HARF: ${currentLetter}`;
            document.getElementById('questionText').innerText = qData.q;
            document.getElementById('speechTranscript').innerText = '';

            // Read aloud prompt
            speakPrompt(`${currentLetter} harfi. ${qData.q}`);
        }

        function evaluateSpeechInput(inputStr) {
            if (!gameState.isRunning || gameState.isSpeaking) return;

            const currentLetter = ALPHABET[gameState.currentIndex];
            const qData = QUESTIONS_BANK[currentLetter];

            // Normalize speech for Turkish
            const cleanInput = inputStr.toLocaleUpperCase('tr-TR');

            // Keyword: PAS
            if (cleanInput.includes("PAS") || cleanInput === "PASS") {
                handlePass();
                return;
            }

            // Keyword: BAŞLA / BAŞLAT
            if (!gameState.isRunning && (cleanInput.includes("BAŞLA") || cleanInput.includes("BAŞLAT"))) {
                startGame();
                return;
            }

            // Check Correct Answer (Main answer or alternates)
            const targetAnswer = qData.answer.toLocaleUpperCase('tr-TR');
            const isCorrect = cleanInput.includes(targetAnswer) || qData.alt.some(alt => cleanInput.includes(alt.toLocaleUpperCase('tr-TR')));

            if (isCorrect) {
                playSound('correct');
                gameState.lettersState[currentLetter] = 'correct';
                gameState.scoreCorrect++;
                updateScoreboard();
                advanceTurn();
            } else if (cleanInput.length >= 2) {
                // Wrong Answer
                playSound('wrong');
                gameState.lettersState[currentLetter] = 'wrong';
                gameState.scoreWrong++;
                updateScoreboard();
                advanceTurn();
            }
        }

        function handlePass() {
            if (!gameState.isRunning) return;
            const currentLetter = ALPHABET[gameState.currentIndex];
            playSound('pass');
            gameState.lettersState[currentLetter] = 'passed';
            advanceTurn();
        }

        function advanceTurn() {
            gameState.currentIndex = (gameState.currentIndex + 1) % ALPHABET.length;
            setTimeout(() => {
                loadNextQuestion();
            }, 300);
        }

        function updateScoreboard() {
            document.getElementById('scoreCorrect').innerText = gameState.scoreCorrect;
            document.getElementById('scoreWrong').innerText = gameState.scoreWrong;
        }

        function endGame(reason) {
            gameState.isRunning = false;
            clearInterval(gameState.timerInterval);
            if (synth) synth.cancel();

            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnPass').disabled = true;

            const finalMsg = `Oyun Bitti! ${reason} Doğru: ${gameState.scoreCorrect}, Yanlış: ${gameState.scoreWrong}`;
            document.getElementById('questionText').innerText = finalMsg;
            document.getElementById('currentLetterBadge').innerText = 'SONUÇ';

            speakPrompt(finalMsg);
        }

        function resetGame() {
            if (synth) synth.cancel();
            gameState.isRunning = false;
            clearInterval(gameState.timerInterval);

            gameState.timer = 100;
            gameState.scoreCorrect = 0;
            gameState.scoreWrong = 0;
            gameState.currentIndex = 0;
            ALPHABET.forEach(l => gameState.lettersState[l] = 'pending');

            document.getElementById('timerDisplay').innerText = 100;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnPass').disabled = true;
            document.getElementById('questionText').innerText = 'Oyunu başlatmak için aşağıdaki "BAŞLAT" butonuna bas veya "Başla" de!';
            document.getElementById('currentLetterBadge').innerText = 'HARF: A';
            document.getElementById('speechTranscript').innerText = '';
            updateScoreboard();
        }

        // INITIALIZE APP ON LOAD
        window.onload = () => {
            initCamera();
            initSpeech();
            renderAR();
        };
    </script>
</body>
</html>
